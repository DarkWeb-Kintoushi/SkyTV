<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>スカイテレビ</title>
  <style>
    :root {
      color-scheme: light;
      --lime: #a7ef3b;
      --lime-dark: #79c800;
      --ink: #20251c;
      --panel: #ffffff;
      --line: #dfe5d8;
      --muted: #68705f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Yu Gothic UI", "Segoe UI", sans-serif;
      color: var(--ink);
      background: #fff;
    }
    .shell {
      width: min(1120px, calc(100% - 32px));
      margin: 28px auto;
    }
    header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
    }
    .mark {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: linear-gradient(145deg, var(--lime), var(--lime-dark));
      box-shadow: 0 8px 24px rgba(121, 200, 0, .23);
      font-size: 26px;
    }
    h1 { margin: 0; font-size: 28px; letter-spacing: .02em; }
    .subtitle { color: var(--muted); margin-top: 2px; font-size: 13px; }
    .panel {
      background: rgba(255, 255, 255, .92);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 14px 38px rgba(58, 78, 38, .08);
      padding: 18px;
    }
    .controls {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 10px;
    }
    input[type="url"], input[type="text"] {
      width: 100%;
      min-width: 0;
      height: 44px;
      border: 1px solid #ccd5c3;
      border-radius: 10px;
      padding: 0 13px;
      font: inherit;
      background: white;
    }
    input:focus { outline: 3px solid rgba(167, 239, 59, .35); border-color: var(--lime-dark); }
    button {
      height: 44px;
      border: 0;
      border-radius: 10px;
      padding: 0 16px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      color: var(--ink);
      background: var(--lime);
    }
    button:hover { background: #b7f75a; }
    button.secondary { background: #edf1e8; }
    button.secondary:hover { background: #e2e8db; }
    button:disabled { opacity: .55; cursor: wait; }
    #status {
      min-height: 22px;
      margin: 10px 2px 14px;
      color: var(--muted);
      font-size: 13px;
    }
    .library {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
    }
    .drop-zone {
      display: grid;
      min-height: 120px;
      margin: 0 0 16px;
      padding: 18px;
      place-content: center;
      gap: 6px;
      border: 2px dashed #b6c5a7;
      border-radius: 14px;
      color: var(--muted);
      text-align: center;
      cursor: pointer;
      transition: border-color .15s, background .15s, color .15s;
    }
    .drop-zone strong { color: var(--ink); }
    .drop-zone.drag-over {
      border-color: var(--lime-dark);
      background: rgba(167, 239, 59, .16);
      color: var(--ink);
    }
    .player-panel {
      margin: 0 0 18px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #171b14;
      color: white;
    }
    .player-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }
    .player-heading button { height: 34px; }
    #mainPlayer {
      width: 100%;
      max-height: min(65vh, 640px);
      display: block;
      background: black;
      border-radius: 8px;
    }
    .card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: white;
    }
    .preview {
      width: 100%;
      height: 145px;
      display: block;
      object-fit: cover;
      background: #171b14;
    }
    .preview-placeholder {
      height: 145px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #242b20, #13150f);
      color: #dcf8a7;
      font-size: 42px;
    }
    .card-body { padding: 12px; }
    .name {
      overflow: hidden;
      margin-bottom: 6px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .meta { color: var(--muted); font-size: 12px; }
    .card-actions { display: flex; gap: 8px; margin-top: 10px; }
    .card-actions button { height: 34px; flex: 1; padding: 0 8px; }
    .description-label {
      display: block;
      margin: 12px 0 5px;
      font-size: 12px;
      font-weight: 700;
    }
    .description-input {
      width: 100%;
      min-height: 76px;
      padding: 8px 10px;
      border: 1px solid #ccd5c3;
      border-radius: 8px;
      font: inherit;
      font-size: 13px;
      resize: vertical;
    }
    .description-save {
      width: 100%;
      height: 34px;
      margin-top: 6px;
      padding: 0 8px;
    }
    .description-generate {
      width: 100%;
      height: 34px;
      margin-top: 6px;
      padding: 0 8px;
    }
    .empty {
      grid-column: 1 / -1;
      border: 1px dashed #cbd4c2;
      border-radius: 14px;
      padding: 44px 16px;
      text-align: center;
      color: var(--muted);
    }
    .notice {
      margin-top: 12px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }
    @media (max-width: 680px) {
      .controls { grid-template-columns: 1fr; }
      .controls button { width: 100%; }
      .shell { width: min(100% - 20px, 1120px); margin-top: 16px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="mark" aria-hidden="true">▶</div>
      <div>
        <h1>スカイテレビ</h1>
        <div class="subtitle">自分の動画を探して再生・管理</div>
      </div>
    </header>

    <section class="panel">
      <div class="controls">
        <input id="url" type="url" placeholder="保存を許可された動画の直接URLを入力" autocomplete="off">
        <button id="download" type="button">ダウンロード</button>
        <button id="browseFolder" class="secondary" type="button">動画フォルダーを開く</button>
      </div>
      <div id="status" role="status">準備完了</div>
      <input id="fileInput" type="file" accept="video/*" multiple hidden>
      <input id="folderInput" type="file" accept="video/*" multiple webkitdirectory hidden>
      <section id="playerPanel" class="player-panel" hidden aria-label="動画プレーヤー">
        <div class="player-heading">
          <strong id="playerTitle">動画を再生中</strong>
          <button id="closePlayer" class="secondary" type="button">閉じる</button>
        </div>
        <video id="mainPlayer" controls playsinline></video>
      </section>
      <div id="dropZone" class="drop-zone" role="button" tabindex="0" aria-label="動画をドロップまたは選択">
        <strong>動画をここにドラッグ＆ドロップ</strong>
        <span>クリックして動画ファイルを選択することもできます</span>
      </div>
      <div id="library" class="library"></div>
      <div class="notice">
        動画をドロップするか、「動画フォルダーを開く」で自分の動画を選ぶと、ライブラリに追加して再生できます。
        動画データはこのブラウザー内に保存されます。外部URLのダウンロードは、権利者が許可した直接リンクのみ対応し、
        ストリーミング配信の解除やDRM回避は行いません。説明の自動生成は動画の内容を解析せず、ファイル情報をまとめます。
      </div>
    </section>
  </main>

  <script>
    "use strict";

    const DB_NAME = "limewire-library";
    const DB_STORE = "videos";
    const DB_VERSION = 1;
    const statusElement = document.getElementById("status");
    const urlInput = document.getElementById("url");
    const downloadButton = document.getElementById("download");
    const browseFolderButton = document.getElementById("browseFolder");
    const fileInput = document.getElementById("fileInput");
    const folderInput = document.getElementById("folderInput");
    const libraryElement = document.getElementById("library");
    const dropZone = document.getElementById("dropZone");
    const playerPanel = document.getElementById("playerPanel");
    const playerTitle = document.getElementById("playerTitle");
    const mainPlayer = document.getElementById("mainPlayer");
    const cardObjectUrls = new Set();
    let playerObjectUrl = null;

    function setStatus(message) {
      statusElement.textContent = message;
    }

    function openDatabase() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = () => {
          const db = request.result;
          if (!db.objectStoreNames.contains(DB_STORE)) {
            db.createObjectStore(DB_STORE, { keyPath: "id", autoIncrement: true });
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function getAllVideos() {
      const db = await openDatabase();
      return new Promise((resolve, reject) => {
        const request = db.transaction(DB_STORE, "readonly").objectStore(DB_STORE).getAll();
        request.onsuccess = () => resolve(request.result.sort((a, b) => b.createdAt - a.createdAt));
        request.onerror = () => reject(request.error);
      });
    }

    async function addVideo(record) {
      const db = await openDatabase();
      return new Promise((resolve, reject) => {
        const transaction = db.transaction(DB_STORE, "readwrite");
        transaction.objectStore(DB_STORE).add(record);
        transaction.oncomplete = () => resolve();
        transaction.onerror = () => reject(transaction.error);
      });
    }

    async function updateVideoDescription(id, description) {
      const db = await openDatabase();
      return new Promise((resolve, reject) => {
        const transaction = db.transaction(DB_STORE, "readwrite");
        const store = transaction.objectStore(DB_STORE);
        const request = store.get(id);
        request.onsuccess = () => {
          if (!request.result) {
            transaction.abort();
            return;
          }
          request.result.description = description;
          store.put(request.result);
        };
        request.onerror = () => reject(request.error);
        transaction.oncomplete = () => resolve();
        transaction.onerror = () => reject(transaction.error);
        transaction.onabort = () => reject(transaction.error || new Error("動画が見つかりません"));
      });
    }

    async function deleteVideo(id) {
      const db = await openDatabase();
      return new Promise((resolve, reject) => {
        const transaction = db.transaction(DB_STORE, "readwrite");
        transaction.objectStore(DB_STORE).delete(id);
        transaction.oncomplete = () => resolve();
        transaction.onerror = () => reject(transaction.error);
      });
    }

    function formatBytes(bytes) {
      if (!bytes) return "不明";
      if (bytes < 1024) return `${bytes} B`;
      if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
      if (bytes < 1024 * 1024 * 1024) return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
      return `${(bytes / 1024 / 1024 / 1024).toFixed(1)} GB`;
    }

    function formatDuration(seconds) {
      const total = Math.floor(seconds);
      const hours = Math.floor(total / 3600);
      const minutes = Math.floor((total % 3600) / 60);
      const remainingSeconds = total % 60;
      return hours
        ? `${hours}:${String(minutes).padStart(2, "0")}:${String(remainingSeconds).padStart(2, "0")}`
        : `${minutes}:${String(remainingSeconds).padStart(2, "0")}`;
    }

    function readVideoDuration(blob) {
      return new Promise(resolve => {
        const source = URL.createObjectURL(blob);
        const video = document.createElement("video");
        let finished = false;
        const timeout = setTimeout(() => finish(null), 8000);

        function finish(duration) {
          if (finished) return;
          finished = true;
          clearTimeout(timeout);
          video.removeEventListener("loadedmetadata", onLoaded);
          video.removeEventListener("error", onError);
          video.removeAttribute("src");
          video.load();
          URL.revokeObjectURL(source);
          resolve(duration);
        }

        function onLoaded() {
          finish(Number.isFinite(video.duration) ? video.duration : null);
        }

        function onError() {
          finish(null);
        }

        video.preload = "metadata";
        video.addEventListener("loadedmetadata", onLoaded);
        video.addEventListener("error", onError);
        video.src = source;
      });
    }

    async function renderLibrary() {
      for (const url of cardObjectUrls) URL.revokeObjectURL(url);
      cardObjectUrls.clear();
      let videos;
      try {
        videos = await getAllVideos();
      } catch (error) {
        setStatus(`ライブラリを開けませんでした: ${error.message}`);
        return;
      }

      libraryElement.replaceChildren();
      if (!videos.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "動画がまだありません";
        libraryElement.appendChild(empty);
        return;
      }

      for (const video of videos) {
        const url = URL.createObjectURL(video.blob);
        cardObjectUrls.add(url);
        const card = document.createElement("article");
        card.className = "card";

        const preview = document.createElement("video");
        preview.className = "preview";
        preview.src = url;
        preview.muted = true;
        preview.preload = "metadata";

        preview.addEventListener("error", () => {
          preview.replaceWith(Object.assign(document.createElement("div"), {
            className: "preview-placeholder",
            textContent: "▶"
          }));
        });

        const body = document.createElement("div");
        body.className = "card-body";
        const name = document.createElement("div");
        name.className = "name";
        name.title = video.name;
        name.textContent = video.name;
        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = `${formatBytes(video.blob.size)} ・ ${new Date(video.createdAt).toLocaleString("ja-JP")}`;

        const descriptionLabel = document.createElement("label");
        descriptionLabel.className = "description-label";
        descriptionLabel.textContent = "動画の説明";
        const descriptionInput = document.createElement("textarea");
        descriptionInput.className = "description-input";
        descriptionInput.placeholder = "内容やメモを入力してください";
        descriptionInput.value = video.description || "";
        descriptionLabel.htmlFor = `description-${video.id}`;
        descriptionInput.id = descriptionLabel.htmlFor;
        const generateDescription = document.createElement("button");
        generateDescription.type = "button";
        generateDescription.className = "description-generate secondary";
        generateDescription.textContent = "動画情報から説明を自動生成";
        generateDescription.addEventListener("click", async () => {
          if (descriptionInput.value.trim() &&
              !confirm("現在の説明を動画情報から作った説明に置き換えますか？")) {
            return;
          }

          generateDescription.disabled = true;
          try {
            const duration = await readVideoDuration(video.blob);
            const extension = video.name.includes(".")
              ? video.name.split(".").pop().toUpperCase()
              : "不明";
            const description = [
              `動画名: ${video.name}`,
              `形式: ${extension}`,
              `ファイルサイズ: ${formatBytes(video.blob.size)}`,
              `再生時間: ${duration === null ? "取得できません" : formatDuration(duration)}`,
              `登録日: ${new Date(video.createdAt).toLocaleString("ja-JP")}`
            ].join("\n");

            await updateVideoDescription(video.id, description);
            descriptionInput.value = description;
            video.description = description;
            setStatus(`「${video.name}」の説明を自動生成して保存しました`);
          } catch (error) {
            setStatus(`説明を生成・保存できませんでした: ${error.message}`);
          } finally {
            generateDescription.disabled = false;
          }
        });
        const saveDescription = document.createElement("button");
        saveDescription.type = "button";
        saveDescription.className = "description-save secondary";
        saveDescription.textContent = "説明を保存";
        saveDescription.addEventListener("click", async () => {
          saveDescription.disabled = true;
          try {
            await updateVideoDescription(video.id, descriptionInput.value);
            video.description = descriptionInput.value;
            setStatus(`「${video.name}」の説明を保存しました`);
          } catch (error) {
            setStatus(`説明を保存できませんでした: ${error.message}`);
          } finally {
            saveDescription.disabled = false;
          }
        });

        const actions = document.createElement("div");
        actions.className = "card-actions";
        const play = document.createElement("button");
        play.type = "button";
        play.textContent = "プレーヤーで再生";
        play.addEventListener("click", () => playVideo(video));
        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "secondary";
        remove.textContent = "削除";
        remove.addEventListener("click", async () => {
          if (!confirm(`「${video.name}」を削除しますか？`)) return;
          await deleteVideo(video.id);
          URL.revokeObjectURL(url);
          await renderLibrary();
          setStatus("ライブラリから削除しました");
        });
        actions.append(play, remove);
        body.append(name, meta, descriptionLabel, descriptionInput, generateDescription, saveDescription, actions);
        card.append(preview, body);
        libraryElement.appendChild(card);
      }
    }

    function playVideo(video) {
      if (playerObjectUrl) URL.revokeObjectURL(playerObjectUrl);
      playerObjectUrl = URL.createObjectURL(video.blob);
      playerTitle.textContent = video.name;
      mainPlayer.src = playerObjectUrl;
      playerPanel.hidden = false;
      mainPlayer.play().catch(() => {
        setStatus("再生準備ができました。プレーヤーの再生ボタンを押してください");
      });
      playerPanel.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    async function importVideos(files) {
      const videos = Array.from(files).filter(file =>
        file.type.startsWith("video/") || /\.(mp4|webm|mov|m4v|mkv|avi|ogv)$/i.test(file.name)
      );
      if (!videos.length) {
        setStatus("選択した場所に動画ファイルがありません");
        return;
      }

      setStatus("動画をライブラリに追加中...");
      let count = 0;
      for (const file of videos) {
        try {
          await addVideo({
            name: file.webkitRelativePath || file.name,
            blob: file,
            description: "",
            createdAt: Date.now() + count
          });
          count++;
        } catch (error) {
          setStatus(`保存できませんでした: ${error.message}。ブラウザーの空き容量を確認してください`);
          break;
        }
      }
      await renderLibrary();
      if (count) setStatus(`${count}件の動画を追加しました`);
    }

    function safeNameFromUrl(rawUrl) {
      try {
        const url = new URL(rawUrl);
        const name = decodeURIComponent(url.pathname.split("/").pop() || "limewire-video.mp4");
        return name.replace(/[<>:"/\\|?*\u0000-\u001f]/g, "_") || "limewire-video.mp4";
      } catch {
        return "limewire-video.mp4";
      }
    }

    downloadButton.addEventListener("click", async () => {
      const rawUrl = urlInput.value.trim();
      if (!rawUrl) {
        setStatus("保存を許可された動画URLを入力してください");
        urlInput.focus();
        return;
      }

      let parsed;
      try {
        parsed = new URL(rawUrl);
      } catch {
        setStatus("有効なURLではありません");
        return;
      }
      if (!["http:", "https:"].includes(parsed.protocol)) {
        setStatus("HTTPまたはHTTPSのURLのみ使用できます");
        return;
      }

      downloadButton.disabled = true;
      setStatus("ダウンロード中...");
      try {
        const response = await fetch(rawUrl);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const blob = await response.blob();
        if (!blob.type.startsWith("video/") && !/\.mp4|\.webm|\.mov|\.m4v|\.mkv|\.avi$/i.test(parsed.pathname)) {
          throw new Error("動画ファイルではない可能性があります");
        }

        const name = safeNameFromUrl(rawUrl);
        await addVideo({ name, blob, description: "", createdAt: Date.now() });
        await renderLibrary();

        const objectUrl = URL.createObjectURL(blob);
        const anchor = document.createElement("a");
        anchor.href = objectUrl;
        anchor.download = name;
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
        setTimeout(() => URL.revokeObjectURL(objectUrl), 1000);
        setStatus(`ライブラリへ保存しました: ${name}`);
        urlInput.value = "";
      } catch (error) {
        setStatus(`ダウンロードできませんでした: ${error.message}`);
      } finally {
        downloadButton.disabled = false;
      }
    });

    browseFolderButton.addEventListener("click", () => folderInput.click());
    document.getElementById("closePlayer").addEventListener("click", () => {
      mainPlayer.pause();
      mainPlayer.removeAttribute("src");
      mainPlayer.load();
      playerPanel.hidden = true;
      if (playerObjectUrl) {
        URL.revokeObjectURL(playerObjectUrl);
        playerObjectUrl = null;
      }
    });

    fileInput.addEventListener("change", async () => {
      await importVideos(fileInput.files);
      fileInput.value = "";
    });

    folderInput.addEventListener("change", async () => {
      await importVideos(folderInput.files);
      folderInput.value = "";
    });

    dropZone.addEventListener("click", () => fileInput.click());
    dropZone.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        fileInput.click();
      }
    });

    for (const eventName of ["dragenter", "dragover"]) {
      dropZone.addEventListener(eventName, event => {
        event.preventDefault();
        event.dataTransfer.dropEffect = "copy";
        dropZone.classList.add("drag-over");
      });
    }

    for (const eventName of ["dragleave", "dragend"]) {
      dropZone.addEventListener(eventName, event => {
        if (eventName === "dragend" || !dropZone.contains(event.relatedTarget)) {
          dropZone.classList.remove("drag-over");
        }
      });
    }

    dropZone.addEventListener("drop", async event => {
      event.preventDefault();
      dropZone.classList.remove("drag-over");
      await importVideos(event.dataTransfer.files);
    });

    urlInput.addEventListener("keydown", event => {
      if (event.key === "Enter") downloadButton.click();
    });

    renderLibrary();
  </script>
</body>
</html>
